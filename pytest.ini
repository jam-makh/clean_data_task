# Test configuration
[pytest]
# Where project modules are located, allowing tests to import from src/ 
# and the repository root without installing the project as a package.
pythonpath = src .
# Where pytest looks for tests.
testpaths = tests

# Registered custom test markers.
markers =
    spark: tests that require a Spark session. Skip with `-m "not spark"`. 
    db: tests that require Postgres. Skip with `-m "not db"`. 
    kafka: tests that require a Kafka broker. Skip with `-m "not kafka"`.