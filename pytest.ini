# Test configuration, kept here rather than in pyproject.toml so the project
# needs no packaging metadata at all. `pythonpath` is what lets the suite
# import `src.*` and `main` from the repo root without the project being
# installed into the environment.
[pytest]
pythonpath = src .
testpaths = tests

# Registered so an unmarked typo fails loudly instead of silently selecting
# nothing -- `-m spark` matching zero tests and `-m sparl` matching zero tests
# look identical otherwise.
markers =
    spark: needs a JVM and a Spark session. Deselect with `-m "not spark"`
        to keep the pandas suite at its usual speed; the Spark tests pay
        several seconds of JVM startup once per session and are worth it
        only when the port is what you are working on.
    db: needs Postgres reachable on the port .env names. Deselect with
        `-m "not db"`. These skip rather than fail when the container is
        down: a machine without the stack up is a setup condition with its
        own diagnostic (`make verify`), not a code defect.
    kafka: needs the broker reachable at KAFKA_BOOTSTRAP_SERVERS. Deselect
        with `-m "not kafka"`. Skips rather than fails for the same reason
        the db marker does.
