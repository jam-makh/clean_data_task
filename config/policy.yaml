# Cleaning policy

# The distinction that decides what belongs here: a value in this file is a
# JUDGEMENT that a reasonable engineer could set differently. A
# value in src/rules/json/ is a FACT about the world or the source system.
# A regex in merchant.py is neither -- it is parsing algorithm, and it stays
# in code, because externalising it buys a new failure mode and nothing else.

fx:
  # Relative tolerance for TXN_AMOUNT * FX_RATE against BILLING_AMOUNT.
  # Absorbs rounding from 6-decimal rates across varying transaction scales
  # while still isolating true data errors.
  reconcile_tolerance: 0.01

  # Max deviation between a row's own rate and the reference rate for its
  # currency. Set wide deliberately: EUR moved 1.0631-1.1098 and GBP
  # 1.2393-1.2907 across the Mar-Sep 2022 window, which is ordinary trading,
  # not corruption. This catches order-of-magnitude faults -- a dead LBP peg,
  # a misplaced decimal -- not daily drift.
  reference_tolerance: 0.15

validation:
  # Nulls here are the only justification for dropping a row. Every other
  # missing value is flagged and kept. Adding a column to this list makes the
  # pipeline stricter about what it will refuse to process.
  required_columns:
    - TXN_ID
    - ACCOUNT_ID
    - TXN_DATE_TIME_CLEANED
    - TXN_AMOUNT_CLEANED
    - TXN_CCY

codes:
  # ISO 8583 field 3 is six digits in full (type, from-account, to-account);
  # this source carries only the leading transaction-type pair. The field is
  # positional and fixed-length, so 0 and 00 are different tokens -- padding
  # is what makes the lookup key stable after Excel read the column as an
  # integer. A file from a different network may carry the full six.
  processing_code_width: 2
  mcc_width: 4

missing:
  # A 6-character alphanumeric auth code has ~2.2 billion combinations, so
  # across a few thousand rows the expected number of genuine collisions is
  # ~0.001. Any repeat at all is therefore a planted value, not chance.
  # Raise this only for a source where auth codes are legitimately reused.
  auth_repeat_threshold: 2

balance:
  # Absolute tolerance, in the account's own currency, for deciding that a
  # stated running balance accounts for the transactions leading up to it.
  #
  # Absolute rather than relative because this is not a measurement with
  # error -- a balance either accounts for its transactions or it does not,
  # and the only slack needed is the half-cent that repeated addition of
  # 2-decimal figures can leave behind. A relative tolerance would scale with
  # the balance and quietly accept a 60,000 LBP discrepancy on a large
  # account, which is the exact failure this check exists to catch.
  #
  # 0.02 rather than 0.01. A running balance is reached by repeated addition
  # of 2-decimal figures, and the residue that leaves is not bounded by half a
  # cent once a chain is long enough -- on this source the billing-regime
  # chains reconcile on 87.8% of adjacent pairs at 0.01 and on 100.0% of them
  # at 0.02, and the figure does not move again at 0.05, 1.0 or 5.0. That
  # plateau is the evidence: the rows between the two thresholds are rounding,
  # not error, because a real discrepancy would not sit in a band one cent
  # wide. The native regime holds flat at 99.6% across the whole sweep, so the
  # looser tolerance buys nothing there and costs nothing either.
  reconcile_tolerance: 0.02

  # What it costs, in units of "rows this labelling fails to explain", to
  # conclude that the source changed which column moves the balance. Paid once
  # per change point by the segmentation in `_detect_regimes`.
  #
  # It is a floor on the evidence, not a guess at where the seam is. At 50, a
  # run of rows has to be better explained by the other mover by more than 100
  # rows' worth -- two switches, in and out -- before it is called a regime,
  # which is far more than coincidence produces and far less than the 30000
  # rows the real change in this extract is worth. Raise it if noise is
  # opening spurious regimes; lower it if a genuinely short one is being
  # missed. Nothing here encodes how many change points to expect, so a file
  # with none and a file with several are both handled by the same number.
  regime_switch_penalty: 50

duplicates:
  # Tried in order; the first list whose columns are all present wins. These
  # also define the derived upsert key in Stage 2 -- a row identified as a
  # duplicate here and a row that collides on the database key must be the
  # same notion of "same transaction", or the two disagree.
  business_keys:
    - [ACCOUNT_ID, TXN_DATE_TIME, TXN_AMOUNT, MERCHANT_NAME]
    - [ACCOUNT_ID, TXN_DATE_TIME, TXN_AMOUNT]

output:
  # the source writes dates six ways so this is the convention used.
  # Three formats were adopted because a timestamp is rendered at the precision
  # it was actually observed at. Writing every row to the second would print
  # 00:00:00 on the rows that never carried a time of day, which is the
  # fabrication the precision column exists to prevent.
  datetime: "%d-%m-%Y %H:%M:%S"   # SECOND precision
  minute: "%d-%m-%Y %H:%M"        # MINUTE precision
  date: "%d-%m-%Y"                # DAY precision, and every date-only column
