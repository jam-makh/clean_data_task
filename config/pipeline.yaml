# Runtime wiring: where the pipeline reads from, where it writes to, and which
# steps run for a given kind of file.

# Separate from policy.yaml because it answers a different question. 
# Policy decides WHAT the pipeline does to a row and changes the output; 
# this file decides WHERE the work happens and WHICH steps happen at all. That split is
# why the config fingerprint covers policy.yaml and the rule vocabularies but
# deliberately excludes this file -- pointing the pipeline at a different
# directory must not read as "the rules changed".
#
# `database:` and `kafka:` are below now that both services exist to point at.
# Neither was stubbed in advance, on the rule this file has followed since:
# config for a service nothing talks to yet cannot be validated, and an
# untested default is worse than an absent one.
#
# No credentials here, and none coming. A host, a port and a password differ
# per machine and belong in the environment -- which is also where docker
# compose reads them, so the containers and the clients cannot disagree about
# which values are in force. `src/db/settings.py` reads them.

paths:
  # The default source, used when the command line names no file. It is a
  # default and not a constant: `python main.py <path>` overrides it, which is
  # what makes the pipeline runnable against a file nobody has seen yet
  # without editing anything.
  #
  # The forecast extract, which is the Stage 2 source: it is the file the
  # Spark half was ported against and the only profile ported end to end. The
  # v4 workbook still runs -- `python main.py data/raw/synthetic_dirty_...`
  # detects its profile and cleans it on pandas -- it is simply no longer what
  # a bare `make run` means.
  source: data/raw/forecast_balance_data.csv
  output: data/output/cleaned_transactions.xlsx

# Which steps run, for which kind of file.
#
# This section exists because "reproducible on any file" and "one hardcoded
# step list" cannot both be true. The two sources in hand disagree about
# things a cleaner cannot paper over: the v4 workbook writes '/' dates
# day-first with 0 counterexamples, the forecast extract mixes both
# conventions in one column and needs the macro oracle to settle them.
# Running either file's parser over the other silently produces wrong dates --
# not an error, just wrong months -- so the choice has to be explicit and
# recorded.
#
# `detect` names the columns that identify a file as belonging to a profile.
# All of them must be present. Profiles are tried in the order written and the
# first whose columns are all present wins, so the more specific profile is
# listed first. A file matching none of them is an error naming what was
# looked for, rather than a default guess: a source nobody has described is
# exactly the case where guessing costs the most.
#
# `--profile NAME` on the command line skips detection entirely, which is the
# escape hatch for a file whose columns lie.
profiles:
  # The forecast-balance extract. Detected by TXN_SEQ plus the macro columns,
  # none of which the v4 workbook has.
  forecast_balance:
    detect: [TXN_SEQ, INTEREST_RATE_INDEX, INFLATION_INDEX]
    steps:
      # timestamps first: every later step that orders, groups or joins by
      # date depends on it, and macro joins on the month it produces.
      - timestamps
      - macro
      - duplicates
      - codes
      - amounts
      # balance follows amounts: it moves the running balance by
      # TXN_AMOUNT_CLEANED, which does not exist until that step has parsed it
      # and signed it by the direction its processing code declares.
      - balance
      - missing
      - merchant
      - geo
      - mcc
      - consistency

  # The v4 workbook. TERMINAL_ID is the discriminator -- the forecast extract
  # has no terminal column at all.
  transactions_v4:
    detect: [TERMINAL_ID, MATCHES_STATUS]
    steps:
      # Dates precede duplicates because that step sequences IDs by date, and
      # sorting mixed-format date strings orders garbage. amounts follows
      # codes because it signs each amount by the transaction type that step
      # resolves. mcc follows merchant because it groups by the cleaned name.
      - dates
      - duplicates
      - codes
      - amounts
      - missing
      - merchant
      - geo
      - mcc
      - consistency


# Which engine a run without --engine uses.
#
# Not a performance switch. The two engines produce different things: `spark`
# reads the extract, cleans it and upserts to Postgres; `pandas` cleans in
# memory and writes the multi-sheet workbook. Choosing one chooses what the
# run produces, which is why it is stated here rather than inferred from the
# source's size or extension.
#
# `spark` because that is the Stage 2 deliverable. `--engine pandas` is the
# Stage 1 path and still works on either source.
engine: spark


# How the Spark run treats Postgres. Where Postgres IS lives in .env; see the
# note at the top of this file.
database:
  # False makes a run read, clean and report without writing -- the state you
  # want when the question is whether the cleaning is right, not whether the
  # write is. `--no-database` on the command line forces it off for one run.
  enabled: true

  # Rows per JDBC round trip. The driver's default is 1000 and the round trip
  # is the expensive part, so this is raised; not raised further because a
  # batch Postgres rejects reports an error covering the whole batch, and a
  # wider batch makes that message point at a wider range of rows.
  batch_size: 10000


# What a finished run announces, and where.
#
# Kafka carries the *event*, not the transactions. The rows go to Postgres;
# what travels here is a statement that a job ran, over which source, under
# which config fingerprint, and with these totals. A consumer wanting the rows
# joins on `sync_job_id`, which is why that id is derived from the source
# rather than generated -- the same load produces the same id in both places.
#
# The broker's address is NOT here. It is KAFKA_BOOTSTRAP_SERVERS in .env, for
# the reason given at the top of this file, and because a real cluster is a
# comma-separated list of hosts that differs per deployment.
kafka:
  # False makes a run write to Postgres and announce nothing. The right
  # setting while the broker is down and the cleaning is what you are working
  # on; `--no-emit` forces it off for a single run.
  enabled: true

  # The `.v1` is the wire contract, not decoration. A breaking change to the
  # payload means a new topic rather than a new field: a consumer reading v1
  # must never be handed a v2 message on the same topic. scripts/verify_env.py
  # checks for this exact name.
  topic: pipeline.run.completed.v1

  # The other direction. This one is published by whoever put a row into
  # raw_transactions -- scripts/dummy_producer.py, standing in for the system
  # that would really do it -- and consumed by consumer.py, which reads the
  # row, cleans it and writes it to cleaned_transactions.
  #
  # A second topic rather than a second field on the first, because the two
  # events are read by different things and travel in opposite directions.
  # Sharing one would put the consumer's own output back in front of it: the
  # completion events it publishes would come back as messages it does not
  # recognise, be skipped, and the only symptom would be a consumer doing half
  # the work it appears to.
  raw_topic: transactions.raw.ingested.v1

  # Used only when a topic is created, and applied to both of them. One partition is enough for an event
  # stream keyed by job id and read by a single consumer, and more would buy
  # parallelism nothing needs at the cost of ordering between jobs.
  partitions: 1

  # One, because a single-broker cluster cannot satisfy more. This is the same
  # constraint docker-compose.yml handles for the internal topics, whose
  # default of three would leave them uncreatable.
  replication_factor: 1

  # Seconds to wait for the broker to acknowledge before the publish is
  # reported as failed. Generous on purpose: the alternative to waiting is
  # recording a run as announced when nobody heard it.
  delivery_timeout: 30

  # How consumer.py reads raw_topic.
  consumer:
    # Kafka tracks committed offsets per group, so this name is what decides
    # whether a restarted consumer resumes where it left off or reads the
    # whole topic again. Changing it is the supported way to replay
    # everything; deleting the group is the other.
    group_id: cleaning-consumer

    # Where a group with no committed offset starts. `earliest`, so a
    # consumer started after the producer has already published picks up what
    # is waiting. `latest` would make the first run of a fresh group skip
    # every message published before it started -- which is indistinguishable,
    # from the outside, from a consumer that does not work.
    auto_offset_reset: earliest

    # Seconds a poll waits before returning empty. Not a limit on anything:
    # it is how often the loop gets to notice it has been asked to stop.
    poll_timeout: 1.0

    # Most ids gathered into one Spark job. A job over one row and a job over
    # fifty cost nearly the same -- the fixed cost is scheduling, not data --
    # so a burst is worth cleaning together. `--batch-size 1` on the command
    # line is the setting for watching a single transaction go through.
    batch_size: 25

    # Seconds Kafka allows between polls before deciding this consumer has
    # died. The default is 300 and a Spark batch can exceed it on a cold
    # session -- the broker then revokes the partitions, the commit fails, and
    # the batch is redelivered to a consumer that takes just as long, which is
    # a livelock rather than a slow run. Raised well past anything a batch
    # should take; the only cost of the larger value is that a genuinely hung
    # consumer takes longer to be noticed.
    max_poll_interval: 1800

    # Where a message that will NOT decode is kept, as JSON Lines.
    #
    # This is the one failure raw_transactions.status cannot record. A row
    # that will not clean is marked FAILED with its reason and retried by id;
    # a message that will not decode has no id -- that is precisely what is
    # wrong with it -- so there is no row to mark. Without this file such a
    # message is printed once and its offset committed, and a restart erases
    # the only evidence it arrived.
    #
    # Under data/, which .gitignore excludes wholesale: these are arbitrary
    # bytes off a topic and may carry transaction data, so committing them is
    # not an option. In its own directory rather than data/output/, which
    # means "results of a successful clean" and should not have a quarantine
    # file sitting among the deliverables.
    #
    # Relative to wherever the consumer runs, which is the caveat worth
    # stating: the file is local to that process. It does not survive a
    # container rebuild unless this path is on a mounted volume, and two
    # replicas would keep two files nobody joins. Fine for one consumer;
    # not fine as a surprise.
    audit_trail: data/audit_trail/undecodable.jsonl

    # Batches to clean before the Spark session is stopped and rebuilt.
    #
    # A batch run is a process: it starts a driver, cleans a file, and exits,
    # and everything the driver accumulated goes with it. A consumer never
    # exits, and that difference is not a detail -- the driver keeps state per
    # batch that nothing inside a batch can release. Cached blocks and
    # broadcast relations stay reachable until the plans referencing them are
    # collected; the status listeners hold a bounded but non-zero history;
    # Python worker processes are pooled and reused. Each is small. None is
    # zero, and the sum over a few hundred batches is a driver whose heap is
    # mostly the residue of work that finished an hour ago -- which is exactly
    # how this consumer died: OutOfMemoryError while cleaning a single row,
    # having reached Spark stage 1777 without restarting.
    #
    # Recycling is the only fix that BOUNDS this rather than slowing it down.
    # `spark_setup` caps what the listeners retain and the consumer session
    # turns off broadcast joins, and both are worth having; neither can make a
    # driver's footprint stop being a function of how long it has been up. A
    # rebuild resets that function to zero.
    #
    # 50 balances the two costs directly. Rebuilding costs a few seconds of
    # session start, paid once per 50 batches and not per message; leaving it
    # too long is what the paragraph above describes. Raise it if the restarts
    # are visible in the log and the driver is comfortable; lower it if a
    # long-running consumer still grows.
    #
    # 0 turns it off, which is right for `--once` and for a demo short enough
    # that the driver cannot get old.
    renew_every: 50
