[project]
name = "cleaning-task"
version = "0.1.0"
description = "Transaction data cleaning pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
clean-transactions = "cleaning_task.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleaning_task"]

[tool.hatch.build.targets.wheel.force-include]
"src/cleaning_task/rules/json" = "cleaning_task/rules/json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
